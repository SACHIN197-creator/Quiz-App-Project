<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <button id="themeToggle" class="btn btn-light theme-btn">
        🌙
    </button>

    <div class="container">

        <div id="start-screen" class="card quiz-card text-center">

            <h1 class="display-5 fw-bold mb-3">
                Quiz App
            </h1>

            <p class="lead">
                Test your HTML, CSS and JavaScript knowledge.
            </p>

            <div class="mb-4">
                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Enter Your Name">
            </div>

            <button id="startBtn"
                    class="btn btn-primary btn-lg">
                Start Quiz
            </button>

        </div>

        <!-- =====================
             QUIZ SCREEN
        ====================== -->

        <div id="quiz-screen"
             class="card quiz-card d-none">

            <!-- Header -->

            <div class="d-flex justify-content-between align-items-center mb-3">

                <span id="questionCounter"
                      class="badge bg-primary fs-6">
                    Question 1 / 10
                </span>

                <span id="timer"
                      class="badge bg-danger fs-6">
                    30s
                </span>

            </div>

            <!-- Progress -->

            <div class="progress mb-4">

                <div id="progressBar"
                     class="progress-bar progress-bar-striped progress-bar-animated"
                     role="progressbar"
                     style="width:0%">
                </div>

            </div>

            <!-- Question -->

            <h3 id="question"
                class="mb-4">
            </h3>

            <!-- Options -->

            <div id="options"
                 class="d-grid gap-3">
            </div>

            <!-- Next Button -->

            <div class="text-end mt-4">

                <button id="nextBtn"
                        class="btn btn-success">
                    Next Question →
                </button>

            </div>

        </div>

        <!-- =====================
             RESULT SCREEN
        ====================== -->

        <div id="result-screen"
             class="card quiz-card text-center d-none">

            <h2 class="mb-3">
                Quiz Completed 🎉
            </h2>

            <h3 id="finalScore">
                Score: 0 / 10
            </h3>

            <h5 id="accuracy"
                class="mb-4">
                Accuracy: 0%
            </h5>

            <button id="restartBtn"
                    class="btn btn-primary mb-4">
                Play Again
            </button>

            <!-- Leaderboard -->

            <div>

                <h4 class="mb-3">
                    Leaderboard 🏆
                </h4>

                <ul id="leaderboard"
                    class="list-group">
                </ul>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Questions File -->
    <script src="js/questions.js"></script>

    <!-- Main JS -->
    <script src="js/app.js"></script>

</body>
</html>
